[package]
name = "screenshotx"
version = "1.0.0"
description = "Screenshot X — screenshots, recordings, annotations"
edition = "2021"
rust-version = "1.85"

[lib]
name = "screenshotx_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-drag = "2"
tauri-nspanel = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
png = "0.17"
rand = "0.9"
url = "2"
urlencoding = "2"
dirs = "6"
gifski = { version = "1.34", default-features = false, features = ["png"] }
imgref = "1"
rgb = "0.8"
base64 = "0.22"
# local Ollama API for OCR (plain HTTP, no TLS)
ureq = { version = "2.12", default-features = false, features = ["json"] }
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"
objc2-av-foundation = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "objc2-core-video", "objc2-quartz-core", "objc2-core-audio-types", "objc2-avf-audio", "objc2-uniform-type-identifiers"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-quartz-core = "0.3"
objc2-image-io = "0.3"
objc2-uniform-type-identifiers = "0.3"

[profile.dev]
opt-level = 1
debug = false
# `debug = false` implies `strip = "debuginfo"`, which corrupts proc-macro
# dylibs with the current macOS linker ("mis-aligned LINKEDIT string pool").
strip = false
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false
strip = false

[profile.dev.build-override]
opt-level = 0
debug = false
strip = false

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
# same proc-macro dylib corruption as in dev (see above)
strip = false

[profile.release.package."*"]
strip = false

[profile.release.build-override]
strip = false
